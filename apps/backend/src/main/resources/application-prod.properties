# ===================================================================
# RetailFlow — Production profile
# Activate: SPRING_PROFILES_ACTIVE=prod (set di docker-compose.yml)
# Override seluruh konfigurasi development-friendly.
# ===================================================================

# OpenAPI / Swagger UI
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

# Logging: production-friendly (WARN root, INFO app)
logging.level.root=WARN
logging.level.toko_online=INFO
logging.level.org.springframework.security=WARN
logging.level.org.flywaydb=INFO

# Actuator: health check details hanya untuk role ADMIN
management.endpoint.health.show-details=when-authorized
management.endpoint.health.roles=ADMIN
